name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ODOO_WEBHOOK_SECRET: ${{ secrets.ODOO_WEBHOOK_SECRET }}
          COUPON_EXPIRY_DAYS: ${{ secrets.COUPON_EXPIRY_DAYS }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}

      - name: Write SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Rsync build output to EC2
        run: |
          rsync -az --delete \
            -e "ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no" \
            .output/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_APP_DIR }}/.output/

      - name: Restart PM2
        run: |
          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "pm2 restart jalkimaku || pm2 start ${{ secrets.EC2_APP_DIR }}/.output/server/index.mjs --name jalkimaku && pm2 save"

      - name: Cleanup SSH key
        if: always()
        run: rm -f /tmp/deploy_key
